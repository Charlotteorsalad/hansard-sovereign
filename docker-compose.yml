# One-command local deploy: backend + frontend.
#
#   ollama serve            # on the HOST (keeps the GPU; models stay put)
#   docker compose up --build
#   → web  http://localhost:3000   ·   api http://localhost:8000
#
# Ollama is intentionally NOT containerised: it owns the GPU, and keeping it on
# the host avoids NVIDIA-Container-Toolkit setup. The backend reaches it via
# host.docker.internal. The data/ dir (sqlite + chroma) is mounted, not baked
# into the image — populate it first with the ingest pipeline.
#
# WSL2 + Docker Desktop gotcha: host.docker.internal resolves to the Docker
# Desktop VM's view of "host", which is NOT the same machine as a WSL distro
# running Ollama as its own systemd service — the backend will reach an empty
# Ollama (or none) and every generation 404s. If `docker compose logs backend`
# shows "model '...' not found" despite `ollama list` showing it, override:
#   OLLAMA_BASE_URL=http://$(hostname -I | awk '{print $1}'):11434 docker compose up --build
# (that IP is only stable for the current WSL session — re-check after a reboot).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CUDA_VISIBLE_DEVICES: ""
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach host Ollama on Linux
    volumes:
      - ./data:/app/data # sqlite/chroma need write access for WAL + lock files
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
